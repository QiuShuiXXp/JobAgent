[project]
name = "jobagent"
version = "0.1.0"
description = "求职智能体：上传简历 -> 确认意向 -> 扫码登录BOSS直聘 -> 筛岗 -> 用户确认 -> 自动打招呼"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "jinja2",
    "sqlalchemy[asyncio]",
    "DrissionPage",
    "pypdf",
    "pdfplumber",
    "python-docx",
    "pydantic",
    "pydantic-settings",
    "langchain",
    "langchain-openai",
    "mcp>=1.30,<2",
    "pyyaml",
    "simpleeval",
    "aiosqlite>=0.22.1",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pyinstaller>=6.22.3",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobagent"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
